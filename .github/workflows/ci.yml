name: CI

# Type-check, test and build.
#
# This is the real gate on the code, and it is deliberately kept separate from
# deployment. Deployment depends on GitHub Pages being enabled on the
# repository, which is a repo-settings and billing-plan question rather than a
# question about whether the code is correct — so it must not be able to mark a
# perfectly good commit as failing. See deploy.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push supersedes an in-flight run rather than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm has to be installed *before* setup-node, because `cache: pnpm`
      # resolves the store path by running pnpm. Reversing these two steps
      # fails with "Unable to locate executable file: pnpm".
      #
      # No `version` input: the action reads the `packageManager` field from
      # package.json, so the pinned version lives in exactly one place.
      # Passing both would be an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile is the default in CI, but stating it makes the intent
      # explicit: a lockfile that disagrees with package.json should fail here
      # rather than be silently updated.
      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
