name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages.
#
# Enable once under Settings -> Pages -> Source -> GitHub Actions. Until then
# the build job still runs and acts as CI; only the deploy step needs Pages.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push supersede an in-flight
# one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # GitHub Pages serves a project site from /<repo-name>/, so assets have
        # to be resolved from there rather than from the domain root.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        # Pages has no rewrite rules; a copy of index.html at 404.html means a
        # deep link still loads the app instead of GitHub's error page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
